<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <style>
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
    @keyframes eye { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .dust { animation: drift 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .eye { animation: eye 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .dust, .pulse, .eye { animation: none !important; }
      .dust { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070A"/><stop offset="1" stop-color="#120A0C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#050506" stop-opacity="0"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="698" height="298" rx="8" fill="url(#bg)" stroke="#3A1E20" stroke-width="2"/>
  <rect x="1" y="1" width="5" height="298" fill="#C8102E"/>
  <radialGradient id="tileglow" cx="0.5" cy="0.5" r="0.6">
    <stop offset="0" stop-color="#C8102E" stop-opacity="0.35"/><stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
  </radialGradient>
  <rect x="34" y="34" width="150" height="232" rx="6" fill="#09070A" stroke="#3A1E20" stroke-width="1.5"/>
  <rect x="34" y="34" width="150" height="232" rx="6" fill="url(#tileglow)"/>
  <g>
      <rect x="77" y="108.0" width="64" height="84" rx="4" fill="#EDE6E3"/>
      <rect x="89" y="122.0" width="40" height="5" rx="2" fill="#1C0E10"/>
      <rect x="89" y="135.0" width="34" height="4" rx="2" fill="#6E5E60"/>
      <rect x="89" y="145.0" width="38" height="4" rx="2" fill="#6E5E60"/>
      <rect x="89" y="155.0" width="26" height="4" rx="2" fill="#6E5E60"/>
      <circle cx="135" cy="182.0" r="17" fill="#C8102E"/>
      <path d="M 127,182.0 l 6,6 l 10,-11" fill="none" stroke="#EDE6E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="212" y="82" font-family="Bahnschrift" font-weight="700" font-size="34" letter-spacing="1" fill="#EDE6E3">FirstRole</text>
  <rect x="554" y="54" width="112" height="28" rx="2" fill="#1C0E10" opacity="1"/>
  <rect x="554" y="54" width="112" height="28" rx="2" fill="none" stroke="#A8999A" stroke-width="1.4"/>
  <text x="610.2" y="73" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="12.5" letter-spacing="2" fill="#A8999A">LIVE DEMO</text>
  <text x="214" y="128" font-family="Bahnschrift" font-size="17" fill="#A8999A">A student job finder that reads public careers</text><text x="214" y="153" font-family="Bahnschrift" font-size="17" fill="#A8999A">pages and turns them into a shortlist with</text><text x="214" y="178" font-family="Bahnschrift" font-size="17" fill="#A8999A">sources, match reasons, and freshness, not</text><text x="214" y="203" font-family="Bahnschrift" font-size="17" fill="#A8999A">invented openings.</text>
  <rect x="214" y="238" width="107" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="267.5" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">TypeScript</text><rect x="331.0" y="238" width="172" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="416.9" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">Cloudflare Workers</text><rect x="512.8" y="238" width="91" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="558.2" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">TinyFish</text>
  <rect width="700" height="300" filter="url(#grain)" opacity="0.04"/>
</svg>
