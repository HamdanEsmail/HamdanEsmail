<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <style>
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
    @keyframes eye { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .dust { animation: drift 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .eye { animation: eye 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .dust, .pulse, .eye { animation: none !important; }
      .dust { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070A"/><stop offset="1" stop-color="#120A0C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#050506" stop-opacity="0"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="698" height="298" rx="8" fill="url(#bg)" stroke="#3A1E20" stroke-width="2"/>
  <rect x="1" y="1" width="5" height="298" fill="#C8102E"/>
  <radialGradient id="tileglow" cx="0.5" cy="0.5" r="0.6">
    <stop offset="0" stop-color="#C8102E" stop-opacity="0.35"/><stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
  </radialGradient>
  <rect x="34" y="34" width="150" height="232" rx="6" fill="#09070A" stroke="#3A1E20" stroke-width="1.5"/>
  <rect x="34" y="34" width="150" height="232" rx="6" fill="url(#tileglow)"/>
  <g>
      <path d="M 69,122.0 h 64 a 10 10 0 0 1 10 10 v 34 a 10 10 0 0 1 -10 10 h -40 l -16 14 v -14 h -8 a 10 10 0 0 1 -10 -10 v -34 a 10 10 0 0 1 10 -10 z" fill="#EDE6E3"/>
      <circle cx="91" cy="151.0" r="4.5" fill="#1C0E10"/><circle cx="107" cy="151.0" r="4.5" fill="#1C0E10"/><circle cx="123" cy="151.0" r="4.5" fill="#1C0E10"/>
      <path d="M 141,106.0 a 22 22 0 0 1 16 16" fill="none" stroke="#FF4D4D" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 143,92.0 a 36 36 0 0 1 28 28" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="212" y="82" font-family="Bahnschrift" font-weight="700" font-size="34" letter-spacing="1" fill="#EDE6E3">CourseSignal</text>
  <rect x="554" y="54" width="112" height="28" rx="2" fill="#1C0E10" opacity="1"/>
  <rect x="554" y="54" width="112" height="28" rx="2" fill="none" stroke="#A8999A" stroke-width="1.4"/>
  <text x="610.2" y="73" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="12.5" letter-spacing="2" fill="#A8999A">LIVE DEMO</text>
  <text x="214" y="128" font-family="Bahnschrift" font-size="17" fill="#A8999A">An evidence-first student copilot in iMessage.</text><text x="214" y="153" font-family="Bahnschrift" font-size="17" fill="#A8999A">It finds and reads live public sources, then</text><text x="214" y="178" font-family="Bahnschrift" font-size="17" fill="#A8999A">replies with a short, receipt-backed answer.</text>
  <rect x="214" y="238" width="107" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="267.5" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">TypeScript</text><rect x="331.0" y="238" width="91" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="376.4" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">TinyFish</text><rect x="431.8" y="238" width="91" height="30" rx="2" fill="none" stroke="#3A1E20" stroke-width="1.6"/><text x="477.2" y="259" text-anchor="middle" font-family="Bahnschrift" font-size="14" fill="#EDE6E3">iMessage</text>
  <rect width="700" height="300" filter="url(#grain)" opacity="0.04"/>
</svg>
