  <text x="214" y="126" font-family="Segoe UI" font-size="17" fill="#9DB5B1">A browser investigation thriller released one</text><text x="214" y="151" font-family="Segoe UI" font-size="17" fill="#9DB5B1">chapter a week. Walk the scene, compare a</text><text x="214" y="176" font-family="Segoe UI" font-size="17" fill="#9DB5B1">recorded memory with the room, and decide what</text><text x="214" y="201" font-family="Segoe UI" font-size="17" fill="#9DB5B1">goes on record.</text>
