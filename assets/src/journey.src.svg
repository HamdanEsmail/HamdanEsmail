<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="290" viewBox="0 0 1400 290">
  <style>
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
    @keyframes eye { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .dust { animation: drift 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .eye { animation: eye 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .dust, .pulse, .eye { animation: none !important; }
      .dust { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070A"/><stop offset="1" stop-color="#120A0C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#050506" stop-opacity="0"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1398" height="288" rx="8" fill="url(#bg)" stroke="#3A1E20" stroke-width="2"/>
  <rect x="1" y="1" width="5" height="288" fill="#C8102E"/>
  <text x="44" y="48" font-family="Bahnschrift" font-weight="600" font-size="14" letter-spacing="5" fill="#FF4D4D">PATH</text>
  <line x1="110.0" y1="150" x2="1054.0" y2="150" stroke="#C8102E" stroke-width="2.4"/><line x1="1054.0" y1="150" x2="1290.0" y2="150" stroke="#6E5E60" stroke-width="2" stroke-dasharray="6 8"/><polygon points="110.0,139 121.0,150 110.0,161 99.0,150" fill="#C8102E"/><polygon points="110.0,146 114.0,150 110.0,154 106.0,150" fill="#09070A"/><text x="110.0" y="98" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#EDE6E3">UAEU</text><text x="110.0" y="122" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">B.Sc. Data Science &amp; AI</text><polygon points="346.0,139 357.0,150 346.0,161 335.0,150" fill="#C8102E"/><polygon points="346.0,146 350.0,150 346.0,154 342.0,150" fill="#09070A"/><text x="346.0" y="210" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#EDE6E3">FirstRole</text><text x="346.0" y="234" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">Sep 2026</text><polygon points="582.0,139 593.0,150 582.0,161 571.0,150" fill="#C8102E"/><polygon points="582.0,146 586.0,150 582.0,154 578.0,150" fill="#09070A"/><text x="582.0" y="98" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#EDE6E3">CourseSignal</text><text x="582.0" y="122" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">Oct 2026</text><polygon points="818.0,139 829.0,150 818.0,161 807.0,150" fill="#C8102E"/><polygon points="818.0,146 822.0,150 818.0,154 814.0,150" fill="#09070A"/><text x="818.0" y="210" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#EDE6E3">Study Sprint</text><text x="818.0" y="234" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">Oct 2026</text><circle cx="1054.0" cy="150" r="34" fill="#C8102E" opacity="0.35" filter="url(#glow)"/><g class="pulse"><polygon points="1054.0,130 1074.0,150 1054.0,170 1034.0,150" fill="#FF4D4D" opacity="0.3"/></g><polygon points="1054.0,138 1066.0,150 1054.0,162 1042.0,150" fill="#FF4D4D"/><text x="1054.0" y="98" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#FF4D4D">Borrowed Alibi</text><text x="1054.0" y="122" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">Oct 2026 → Jan 2027</text><polygon points="1290.0,140 1300.0,150 1290.0,160 1280.0,150" fill="#09070A" stroke="#6E5E60" stroke-width="1.6" stroke-dasharray="3 3"/><text x="1290.0" y="210" text-anchor="middle" font-family="Bahnschrift" font-weight="600" font-size="21" fill="#A8999A">Next</text><text x="1290.0" y="234" text-anchor="middle" font-family="Bahnschrift" font-size="14.5" fill="#A8999A">Internships &amp; research</text>
  <rect width="1400" height="290" filter="url(#grain)" opacity="0.04"/>
</svg>
