    .g2 { opacity: 0; animation: vis2 12s linear 8s infinite; }
    .c2 { animation: type2 12s steps(41) 8s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
