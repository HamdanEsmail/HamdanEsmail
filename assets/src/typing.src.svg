<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="76" viewBox="0 0 1400 76">
  <style>
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
    @keyframes eye { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .dust { animation: drift 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .eye { animation: eye 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .dust, .pulse, .eye { animation: none !important; }
      .dust { opacity: 0; }
    }
  </style>
  <style>
    @keyframes vis0 { 0% { opacity: 1; } 32.83% { opacity: 1; } 33.33% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes type0 { 0% { transform: translateX(0); } 18.33% { transform: translateX(420px); } 100% { transform: translateX(420px); } }
    .g0 { opacity: 0; animation: vis0 12s linear 0s infinite; }
    .c0 { animation: type0 12s steps(33) 0s infinite; }
    @keyframes vis1 { 0% { opacity: 1; } 32.83% { opacity: 1; } 33.33% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes type1 { 0% { transform: translateX(0); } 18.33% { transform: translateX(434px); } 100% { transform: translateX(434px); } }
    .g1 { opacity: 0; animation: vis1 12s linear 4s infinite; }
    .c1 { animation: type1 12s steps(36) 4s infinite; }
    @keyframes vis2 { 0% { opacity: 1; } 32.83% { opacity: 1; } 33.33% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes type2 { 0% { transform: translateX(0); } 18.33% { transform: translateX(590px); } 100% { transform: translateX(590px); } }
    .g2 { opacity: 0; animation: vis2 12s linear 8s infinite; }
    .c2 { animation: type2 12s steps(45) 8s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .g0 { opacity: 1 !important; animation: none !important; } .g1, .g2 { animation: none !important; } .c0 { animation: none !important; transform: translateX(2000px); } .blink { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070A"/><stop offset="1" stop-color="#120A0C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#050506" stop-opacity="0"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1398" height="74" rx="10" fill="#120A0C" stroke="#3A1E20" stroke-width="2"/>
  <rect x="1" y="1" width="5" height="74" fill="#C8102E"/>
  <polygon points="44,30 52,38 44,46 36,38" fill="#FF4D4D"/>
  <g class="g0">
    <text id="p0" x="84" y="48" font-family="Bahnschrift" font-size="26" letter-spacing="0.5" fill="#EDE6E3">Data Science &amp; AI student at UAEU</text>
    <g class="c0">
      <rect x="82" y="14" width="1280" height="50" fill="#120A0C"/>
      <rect class="blink" x="84" y="22" width="3" height="32" fill="#FF4D4D"/>
    </g>
  </g>
  <g class="g1">
    <text id="p1" x="84" y="48" font-family="Bahnschrift" font-size="26" letter-spacing="0.5" fill="#EDE6E3">Building tools students actually use</text>
    <g class="c1">
      <rect x="82" y="14" width="1280" height="50" fill="#120A0C"/>
      <rect class="blink" x="84" y="22" width="3" height="32" fill="#FF4D4D"/>
    </g>
  </g>
  <g class="g2">
    <text id="p2" x="84" y="48" font-family="Bahnschrift" font-size="26" letter-spacing="0.5" fill="#EDE6E3">Making Borrowed Alibi, a browser mystery game</text>
    <g class="c2">
      <rect x="82" y="14" width="1280" height="50" fill="#120A0C"/>
      <rect class="blink" x="84" y="22" width="3" height="32" fill="#FF4D4D"/>
    </g>
  </g>
</svg>
