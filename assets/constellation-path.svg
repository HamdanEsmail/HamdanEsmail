    <circle r="3.2" fill="#E3B341"/>
    <g stroke="#C4A574" stroke-width="0.8" opacity="0.8">
      <line x1="0" y1="-11" x2="0" y2="-7"/>
      <line x1="0" y1="7" x2="0" y2="11"/>
      <line x1="-11" y1="0" x2="-7" y2="0"/>
      <line x1="7" y1="0" x2="11" y2="0"/>
    </g>
  </g>
  <g transform="translate(700,92)">
    <circle r="18" fill="#070B14" stroke="#E3B341" stroke-width="1.4"/>
    <circle r="3.2" fill="#E3B341"/>
    <g stroke="#C4A574" stroke-width="0.8" opacity="0.8">
      <line x1="0" y1="-11" x2="0" y2="-7"/>
      <line x1="0" y1="7" x2="0" y2="11"/>
      <line x1="-11" y1="0" x2="-7" y2="0"/>
      <line x1="7" y1="0" x2="11" y2="0"/>
    </g>
  </g>
  <g transform="translate(1150,92)">
    <circle r="18" fill="#070B14" stroke="#E3B341" stroke-width="1.4"/>
    <circle r="3.2" fill="#E3B341"/>
    <g stroke="#C4A574" stroke-width="0.8" opacity="0.8">
      <line x1="0" y1="-11" x2="0" y2="-7"/>
      <line x1="0" y1="7" x2="0" y2="11"/>
      <line x1="-11" y1="0" x2="-7" y2="0"/>
