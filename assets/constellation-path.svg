  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle" fill="#C4A574" font-size="12">
    <text x="250" y="170">concepts, data, and math</text>
    <text x="700" y="170">projects that actually run</text>
    <text x="1150" y="170">problems worth solving</text>
