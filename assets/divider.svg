<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1400"
   height="30"
   viewBox="0 0 1400 30"
   version="1.1"
   id="svg9"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <style
     id="style1">
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
    @keyframes eye { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .dust { animation: drift 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .eye { animation: eye 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .dust, .pulse, .eye { animation: none !important; }
      .dust { opacity: 0; }
    }
  </style>
  <defs
     id="defs7">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#09070A"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#120A0C"
         id="stop2" />
    </linearGradient>
    <radialGradient
       id="vignette"
       cx="0.5"
       cy="0.5"
       r="0.75">
      <stop
         offset="0.55"
         stop-color="#050506"
         stop-opacity="0"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#050506"
         stop-opacity="0.85"
         id="stop4" />
    </radialGradient>
    <linearGradient
       id="redline"
       x1="0"
       y1="0"
       x2="1"
       y2="0">
      <stop
         offset="0"
         stop-color="#C8102E"
         stop-opacity="0"
         id="stop5" />
      <stop
         offset="0.15"
         stop-color="#FF4D4D"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#C8102E"
         stop-opacity="0"
         id="stop7" />
    </linearGradient>
    <filter
       id="grain"
       x="0"
       y="0"
       width="100%"
       height="100%">
      <feTurbulence
         type="fractalNoise"
         baseFrequency="0.9"
         numOctaves="2"
         seed="11"
         id="feTurbulence7" />
      <feColorMatrix
         type="saturate"
         values="0"
         id="feColorMatrix7" />
    </filter>
    <filter
       id="glow"
       x="-50%"
       y="-50%"
       width="200%"
       height="200%">
      <feGaussianBlur
         stdDeviation="6"
         id="feGaussianBlur7" />
    </filter>
  </defs>
  <rect
     x="120"
     y="14"
     width="560"
     height="1.5"
     fill="url(#redline)"
     transform="rotate(180 400 15)"
     id="rect7" />
  <rect
     x="720"
     y="14"
     width="560"
     height="1.5"
     fill="url(#redline)"
     id="rect8" />
  <polygon
     points="700,8 707,15 700,22 693,15"
     fill="#FF4D4D"
     id="polygon8" />
  <polygon
     points="700,3 712,15 700,27 688,15"
     fill="none"
     stroke="#C8102E"
     stroke-width="1.2"
     id="polygon9" />
</svg>
